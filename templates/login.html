<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Pet Care</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            🐾
        </div>

        <h1>Welcome Back!</h1>

        <p>
            Login to continue to Pet Care
        </p>


        <!-- ERROR MESSAGE -->

        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST"
              action="{{ url_for('login') }}">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-btn full-btn">

                LOGIN

            </button>

        </form>


        <div class="or">
            OR
        </div>


        <a href="{{ url_for('signup') }}">

            <button
                type="button"
                class="secondary-btn full-btn">

                CREATE ACCOUNT

            </button>

        </a>


        <p class="bottom-text">

            Don't have an account?

            <a href="{{ url_for('signup') }}">
                Sign Up
            </a>

        </p>


        <a href="{{ url_for('home') }}"
           class="back-link">

Home

        </a>

    </div>

</div>

</body>

</html>
