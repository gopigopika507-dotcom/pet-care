<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Pet Care</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            🐾
        </div>

        <h1>Create Account</h1>

        <p>
            Start your pet's care journey
        </p>


        <!-- ERROR -->

        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <!-- SIGNUP FORM -->

        <form method="POST"
              action="{{ url_for('signup') }}">


            <label>
                Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <button
                type="submit"
                class="primary-btn full-btn">

                CREATE ACCOUNT

            </button>

        </form>


        <p class="bottom-text">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>


        <a href="{{ url_for('home') }}"
           class="back-link">

Home

        </a>

    </div>

</div>

</body>

</html>
